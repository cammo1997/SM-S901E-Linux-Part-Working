# Galaxy S22 bring-up: modules kept from auto-loading (see notes/boot-log.md).
# Tested OK and allowed (2026-10-17): socinfo qcom_rng qcom_spmi_temp_alarm qcom_spmi_adc5 rmtfs_mem qcom_stats coresight_funnel
#   zram i2c_qcom_geni max77705 (patched for rev 0x2) max17042_battery max77705_hwmon phy_qcom_qmp_pcie pwrseq_qcom_wcn
#   pci_pwrctrl_pwrseq hci_uart (Bluetooth works)
# HANGS THE SOC: Qualcomm crypto engine, likely TrustZone-owned on Samsung.
blacklist qcrypto
