blacklist qcomtee
# Audio (LPASS): untested, needs the ADSP running first.
blacklist pinctrl_sm8450_lpass_lpi
blacklist snd_soc_lpass_wsa_macro
blacklist snd_soc_lpass_rx_macro
blacklist snd_soc_lpass_tx_macro
# Wi-Fi: chip enumerates on PCIe but firmware load fails at BHI (-5/-110); wastes ~20 s per try. Debug manually.
# blacklist ath11k_pci  (Wi-Fi works since attempt 19)
