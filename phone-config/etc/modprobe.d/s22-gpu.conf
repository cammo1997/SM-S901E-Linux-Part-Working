# Unified msm DRM device (/dev/dri/card0 = MDSS DPU1 KMS + Adreno 730 GPU)
# and 120 us fence micro-spin before sleeping on short GPU submits.
# Separate_gpu_kms=1 was only needed in early bring-up before MDSS probed and
# caused KWin to open KMS-only card1 and fall back to CPU llvmpipe rendering.
options msm separate_gpu_kms=0 fence_spin_us=120
