[Unit]
After=systemd-udevd.service

[Service]
ExecStartPre=+/bin/sh -c 'chgrp fastrpc /dev/fastrpc-sdsp && chmod 0660 /dev/fastrpc-sdsp'
ExecStart=
ExecStart=/usr/local/lib/s22/s22-hex-cb3 /usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8450/Samsung/r0q/
Restart=always
RestartSec=2
