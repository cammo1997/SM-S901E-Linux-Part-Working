[Unit]
After=systemd-modules-load.service systemd-udevd.service
ConditionPathExists=
ConditionPathExists=/var/lib/rmtfs/modem_fs1
ConditionPathExists=/var/lib/rmtfs/modem_fs2
ConditionPathExists=/var/lib/rmtfs/modem_fsg

[Service]
# SAFETY: Always serve EFS from read-only file copies (-r -o /var/lib/rmtfs), never raw partitions (-P).
ExecStartPre=/sbin/modprobe rmtfs_mem
ExecStart=
ExecStart=/usr/sbin/rmtfs -r -s -o /var/lib/rmtfs
Restart=always
RestartSec=2
