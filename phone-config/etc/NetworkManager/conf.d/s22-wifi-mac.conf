# S22: real Wi-Fi MAC from EFS /wifi/.mac.info (ath11k gets a random one each boot)
# Replace with YOUR phone's MAC from your own EFS backup.
[device-s22-wlan]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

[connection-s22-wlan]
match-device=interface-name:wlan0
wifi.cloned-mac-address=XX:XX:XX:XX:XX:XX
