# Keep usb0 completely unmanaged by NetworkManager so NM never clones its MAC,
# runs DHCPv4 client loops on it, or strips 172.16.42.1/16 on replug/sleep.
[main]
no-auto-default=interface-name:usb0

[keyfile]
unmanaged-devices=interface-name:usb0

[device-s22-usb0]
match-device=interface-name:usb0
managed=0
