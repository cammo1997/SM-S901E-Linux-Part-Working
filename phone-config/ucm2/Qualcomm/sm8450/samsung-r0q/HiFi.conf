SectionVerb {
	EnableSequence [
		# MultiMedia1 -> PRIMARY_MI2S_RX, where both CS35L41 amps listen
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Capture: DMICs through the VA macro's LPASS DMA (VA_CODEC_DMA_TX_0) into MultiMedia3
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers (bottom + earpiece, 2x CS35L41)"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		# MultiMedia1 Playback
		PlaybackPCM "hw:${CardId},0"
		# No PlaybackMixer: per-amp volumes are pinned in the BootSequence,
		# the sound server attenuates in software.
	}
}

SectionDevice."Mic" {
	Comment "Built-in digital microphones"

	EnableSequence [
		# Measured (quiet vs noise, 2026-10-18): DMIC1 rms 50->2092 and DMIC4 107->3045 are real mics
		# (DMIC0 is empty; DMIC2/3 untested with noise). Main = DMIC1, second = DMIC4.
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC4"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 112"
		cset "name='VA_DEC1 Volume' 112"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		# MultiMedia3 Capture
		CapturePCM "hw:${CardId},2"
	}
}
