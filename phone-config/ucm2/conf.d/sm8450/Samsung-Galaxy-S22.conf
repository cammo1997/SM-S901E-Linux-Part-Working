Syntax 4

# UCM profile for the Galaxy S22 (SM-S901E, r0q): two Cirrus CS35L41 amps
# (bottom speaker + earpiece) on PRIMARY MI2S and VA DMICs.

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8450/samsung-r0q/HiFi.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."Voice Call" {
	File "/Qualcomm/sm8450/samsung-r0q/VoiceCall.conf"
	Comment "Cellular / VoIP Voice Call."
}

BootSequence [
	cset "name='Speaker PCM Source' ASP"
	cset "name='Earpiece PCM Source' ASP"
	cset "name='Speaker Analog PCM Volume' 14"
	cset "name='Earpiece Analog PCM Volume' 14"
	cset "name='Speaker Digital PCM Volume' 841"
	cset "name='Earpiece Digital PCM Volume' 841"
]

Include.card-init.File "/lib/card-init.conf"
